services:
  agentgate:
    build: .
    # The TTY belongs to the operator CLI (approval prompts, mode toggle);
    # agents connect over the HTTP MCP endpoint published below.
    stdin_open: true
    tty: true
    env_file: .env
    environment:
      POLICIES_PATH: /app/policies/policies.yaml
      STATE_PATH: /app/state/mode.json
      LOGS_PATH: /app/logs/audit.log
      CREDENTIALS_PATH: /app/data/credentials.json
      CONNECTIONS_PATH: /app/data/connections.json
      AGENTS_PATH: /app/data/agents.json
      # 0.0.0.0 is required inside the container: Docker's port mapping
      # forwards to the container's bridge IP, not its loopback. The mapping
      # below publishes only on the HOST's loopback, but note that other
      # containers on the same Docker network can still reach this port
      # directly — agent-key auth and Host-header validation are the real
      # boundary there.
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8848"
    ports:
      - "127.0.0.1:8848:8848"
    volumes:
      - ./policies:/app/policies
      - ./state:/app/state
      - ./logs:/app/logs
      - ./data:/app/data
