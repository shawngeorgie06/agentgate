[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgate"
version = "0.1.0"
description = "Open-source credential broker for AI agents (IAM for agents)"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.scripts]
agentgate = "cli.commands:main"
agentgate-broker = "broker.main:main"

[tool.setuptools]
packages = ["broker", "cli"]
